<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://gwrnfvmygikksawncgtt.supabase.co";
const SUPABASE_KEY = "sb_publishable_t4LjQXW390DJXpGq5eRoSQ_3BepnCCn";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const formulario =
  document.getElementById("registroForm") ||
  document.querySelector("form");

const nombreInput = document.querySelector(
  '#nombre, [name="nombre"], input[placeholder*="Nombre"]'
);

const correoInput = document.querySelector(
  '#correo, [name="correo"], input[type="email"]'
);

const passwordInput = document.querySelector(
  '#password, [name="password"], input[type="password"]'
);

let mensaje = document.getElementById("mensaje");

if (!mensaje && formulario) {
  mensaje = document.createElement("p");
  mensaje.id = "mensaje";
  formulario.appendChild(mensaje);
}

if (!formulario || !nombreInput || !correoInput || !passwordInput) {
  if (mensaje) {
    mensaje.textContent = "No se encontraron todos los campos del formulario.";
    mensaje.style.color = "red";
  }
  console.error("Revisa los campos del formulario de registro.");
} else {
  formulario.addEventListener("submit", async function (event) {
    event.preventDefault();

    const nombre = nombreInput.value.trim();
    const correo = correoInput.value.trim();
    const password = passwordInput.value;

    if (!nombre || !correo || password.length < 6) {
      mensaje.textContent =
        "Completa los datos. La contraseña debe tener al menos 6 caracteres.";
      mensaje.style.color = "red";
      return;
    }

    mensaje.textContent = "Creando tu cuenta...";
    mensaje.style.color = "blue";

    const boton = formulario.querySelector('button[type="submit"]');
    if (boton) boton.disabled = true;

    try {
      const { data, error } = await supabase.auth.signUp({
        email: correo,
        password,
        options: {
          data: { nombre },
          emailRedirectTo:
            "https://sebastianrodriguezrivera876-stack.github.io/campogana/index.html"
        }
      });

      if (error) throw error;

      mensaje.style.color = "green";

      if (data.user) {
        mensaje.textContent = data.session
          ? "¡Cuenta creada correctamente!"
          : "Registro recibido. Si se requiere confirmación, revisa tu correo.";
      }

      if (data.session) {
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1200);
      }
    } catch (error) {
      console.error("Error de registro:", error);
      mensaje.textContent = error.message || "No se pudo crear la cuenta.";
      mensaje.style.color = "red";
    } finally {
      if (boton) boton.disabled = false;
    }
  });
}
</script>
