<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Panel - CampoGana</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 7%;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
    }

    .volver {
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .bienvenida {
      margin-bottom: 25px;
    }

    .bienvenida h1 {
      margin-bottom: 8px;
    }

    .bienvenida p {
      color: #94a3b8;
    }

    .resumen {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .tarjeta {
      background: #0f1b2d;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 25px;
    }

    .tarjeta h3 {
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .valor {
      font-size: 30px;
      font-weight: bold;
      color: #22c55e;
    }

    .actividad {
      background: #0f1b2d;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 25px;
    }

    .actividad h2 {
      margin-bottom: 20px;
    }

    .mensaje {
      padding: 18px;
      border: 1px solid #1e293b;
      border-radius: 12px;
      color: #94a3b8;
      text-align: center;
    }

    @media (max-width: 700px) {

      .resumen {
        grid-template-columns: 1fr;
      }

      header {
        padding: 18px;
      }

      main {
        margin: 25px auto;
      }

    }

  </style>

</head>

<body>

  <header>

    <div class="logo">
      CampoGana
    </div>

    <a href="dashboard.html" class="volver">
      ← Volver
    </a>

  </header>


  <main>

    <section class="bienvenida">

      <h1>📊 Panel de control</h1>

      <p id="saludo">
        Cargando información...
      </p>

    </section>


    <section class="resumen">


      <div class="tarjeta">

        <h3>💰 Saldo disponible</h3>

        <div class="valor" id="saldo">
          $0.00
        </div>

      </div>


      <div class="tarjeta">

        <h3>📋 Microtareas</h3>

        <div class="valor" id="tareas">
          0
        </div>

      </div>


      <div class="tarjeta">

        <h3>💵 Ganancias</h3>

        <div class="valor" id="ganancias">
          $0.00
        </div>

        <div style="text-align: center; margin-top: 30px;">
  <a href="retiro.html"

     style="
       display: inline-block;
       background: #22c55e;
       color: white;
       padding: 14px 25px;
       border-radius: 10px;
       text-decoration: none;
       font-weight: bold;
     ">
    📤 Retirar dinero
  </a>
</div>
        <div style="text-align: center; margin-top: 15px;">
  <a href="movimientos.html"
     style="
       display: inline-block;
       background: #334155;
       color: white;
       padding: 14px 25px;
       border-radius: 10px;
       text-decoration: none;
       font-weight: bold;
     ">
    📊 Ver movimientos
  </a>
</div>
        
      </div>


    </section>


    <section class="actividad">

      <h2>📈 Actividad reciente</h2>

      <div class="mensaje" id="actividad">
        Todavía no tienes actividades registradas.
      </div>

    </section>


  </main>


  <script>

    document.addEventListener("DOMContentLoaded", function () 

    const usuarioGuardado =
      localStorage.getItem("usuario");


   if (!usuarioGuardado) {
    window.location.href = "index.html";
    return;
  }

  const usuario = JSON.parse(usuarioGuardado);

  document.getElementById("saludo").textContent =
    "Bienvenido nuevamente, " + usuario.nombre + ".";

  const saldo =
    parseFloat(localStorage.getItem("saldo")) || 0;

  const tareas =
    parseInt(localStorage.getItem("tareasCompletadas")) || 0;

  const ganancias =
    parseFloat(localStorage.getItem("ganancias")) || 0;

  document.getElementById("saldo").textContent =
    "$" + saldo.toFixed(2);

  document.getElementById("tareas").textContent =
    tareas;

  document.getElementById("ganancias").textContent =
    "$" + ganancias.toFixed(2);

  const actividad = document.getElementById("actividad");

  if (tareas > 0) {

    actividad.textContent =
      "Has completado " +
      tareas +
      " microtarea(s) y has ganado $" +
      ganancias.toFixed(2) +
      ".";

  } else {

    actividad.textContent =
      "Todavía no tienes actividades registradas.";

  }

});

  </script>

</body>

</html>
