<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - CampoGana</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #0f1b2d;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 35px;
    }

    .logo {
      text-align: center;
      color: #22c55e;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #07111f;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #04110a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">CampoGana</div>

    <h1>Iniciar sesión</h1>

    <form>

      <label>Correo electrónico</label>
      <input
        type="email"
        placeholder="tu correo electrónico"
        required
      >

      <label>Contraseña</label>
      <input
        type="password"
        placeholder="Tu contraseña"
        required
      >

      <button type="submit">
        Iniciar sesión
      </button>

    </form>

    <a class="back" href="index.html">
      ← Volver al inicio
    </a>

  </div>

</body>
</html>
