<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - CampoGana</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07111f;
      padding: 20px;
      color: white;
    }

    .login {
      width: 100%;
      max-width: 420px;
      background: #0f1b2d;
      border: 1px solid #1e293b;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .logo {
      text-align: center;
      color: #22c55e;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitulo {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #07111f;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #04110a;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    #mensaje {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .registro {
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
    }

    .registro a {
      color: #22c55e;
      text-decoration: none;
      font-weight: bold;
    }

    .volver {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #94a3b8;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login">

    <div class="logo">CampoGana</div>

    <h1>Iniciar sesión</h1>

    <p class="subtitulo">
      Ingresa a tu cuenta para continuar
    </p>

    <form id="loginForm">

      <label for="correo">Correo electrónico</label>

      <input
        type="email"
        id="correo"
        placeholder="ejemplo@gmail.com"
        required
      >

      <label for="password">Contraseña</label>

      <input
        type="password"
        id="password"
        placeholder="Ingresa tu contraseña"
        required
      >

      <button type="submit">
        Iniciar sesión
      </button>

      <p id="mensaje"></p>

    </form>

    <p class="registro">
      ¿No tienes una cuenta?
      <a href="registro.html">Crear cuenta</a>
    </p>

    <a href="index.html" class="volver">
      ← Volver al inicio
    </a>

  </div>

  <script src="login.js"></script>

</body>
</html>
