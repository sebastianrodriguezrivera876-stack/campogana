<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración - CampoGana</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 7%;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
    }

    .volver {
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .configuracion {
      background: #0f1b2d;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 30px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .opcion {
      background: #07111f;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .opcion h3 {
      margin-bottom: 8px;
      color: #22c55e;
    }

    .opcion p {
      color: #94a3b8;
    }

    .cerrar {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ef4444;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cerrar:hover {
      background: #dc2626;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px;
      }

      main {
        margin: 25px auto;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">CampoGana</div>

    <a href="dashboard.html" class="volver">
      ← Volver
    </a>
  </header>

  <main>

    <section class="configuracion">

      <h1>⚙️ Configuración</h1>

      <p class="subtitulo">
        Administra las opciones de tu cuenta.
      </p>

      <div class="opcion">
        <h3>👤 Cuenta</h3>
        <p>
          Aquí podrás administrar la información de tu cuenta.
        </p>
      </div>

      <div class="opcion">
        <h3>🔔 Notificaciones</h3>
        <p>
          Próximamente podrás controlar tus notificaciones.
        </p>
      </div>

      <div class="opcion">
        <h3>🔒 Seguridad</h3>
        <p>
          Próximamente podrás administrar las opciones de seguridad.
        </p>
      </div>

      <button class="cerrar" onclick="cerrarSesion()">
        Cerrar sesión
      </button>

    </section>

  </main>

  <script>

    const usuarioGuardado = localStorage.getItem("usuario");

    if (!usuarioGuardado) {
      window.location.href = "login.html";
    }

    function cerrarSesion() {
      localStorage.removeItem("usuario");
      window.location.href = "index.html";
    }

  </script>

</body>
</html>
