<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - CampoGana</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111827;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
    }

    header h2 {
      color: #22c55e;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .contenedor {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .descripcion {
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .estadisticas {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .tarjeta {
      background: #1e293b;
      padding: 22px;
      border-radius: 14px;
    }

    .tarjeta h3 {
      color: #cbd5e1;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .numero {
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
    }

    .seccion {
      background: #1e293b;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

    .seccion h2 {
      margin-bottom: 20px;
    }

    .fila {
      padding: 18px 0;
      border-bottom: 1px solid #334155;
    }

    .fila:last-child {
      border-bottom: none;
    }

    .informacion {
      margin-bottom: 15px;
      line-height: 1.7;
    }

    .estado {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 6px;
      background: #854d0e;
      color: #fde68a;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .estado.aprobado {
      background: #166534;
      color: #bbf7d0;
    }

    .estado.rechazado {
      background: #991b1b;
      color: #fecaca;
    }

    .botones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .aprobar {
      background: #16a34a;
    }

    .rechazar {
      background: #dc2626;
    }

    .aprobar:hover {
      background: #15803d;
    }

    .rechazar:hover {
      background: #b91c1c;
    }

    .vacio {
      color: #94a3b8;
    }

    @media (max-width: 800px) {
      .estadisticas {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .estadisticas {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <h2>CampoGana Admin</h2>

  <a href="index.html">
    ← Salir
  </a>

</header>


<div class="contenedor">

  <h1>🛠️ Panel de administración</h1>

  <p class="descripcion">
    Control y seguimiento de la plataforma CampoGana.
  </p>


  <!-- ESTADÍSTICAS -->

  <div class="estadisticas">

    <div class="tarjeta">
      <h3>👥 Usuarios</h3>
      <div class="numero" id="usuarios">0</div>
    </div>

    <div class="tarjeta">
      <h3>💰 Ganancias</h3>
      <div class="numero" id="ganancias">$0.00</div>
    </div>

    <div class="tarjeta">
      <h3>📤 Retiros</h3>
      <div class="numero" id="retiros">$0.00</div>
    </div>

    <div class="tarjeta">
      <h3>⏳ Pendientes</h3>
      <div class="numero" id="pendientes">0</div>
    </div>

  </div>


  <!-- SOLICITUDES -->

  <div class="seccion">

    <h2>📤 Solicitudes de retiro</h2>

    <div id="listaRetiros">

      <p class="vacio">
        No hay solicitudes registradas.
      </p>

    </div>

  </div>


  <!-- USUARIOS -->

  <div class="seccion">

    <h2>👥 Usuarios registrados</h2>

    <div id="listaUsuarios">

      <p class="vacio">
        No hay usuarios registrados.
      </p>

    </div>

  </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

  const usuario =
    localStorage.getItem("usuario");

  if (!usuario) {

    window.location.href = "index.html";

    return;
  }

  cargarDatos();

});


function cargarDatos() {

  const usuario =
    JSON.parse(
      localStorage.getItem("usuario")
    );


  /* USUARIO */

  const listaUsuarios =
    document.getElementById(
      "listaUsuarios"
    );


  if (usuario) {

    document.getElementById(
      "usuarios"
    ).textContent = "1";


    listaUsuarios.innerHTML =

      '<div class="fila">' +

      '<div class="informacion">' +

      '<strong>' +
      usuario.nombre +
      '</strong><br>' +

      '<small>' +
      usuario.correo +
      '</small>' +

      '</div>' +

      '<span class="estado aprobado">' +
      'Activo' +
      '</span>' +

      '</div>';

  }


  /* GANANCIAS */

  const ganancias =
    parseFloat(
      localStorage.getItem("ganancias")
    ) || 0;


  document.getElementById(
    "ganancias"
  ).textContent =
    "$" + ganancias.toFixed(2);


  /* RETIROS */

  const retiros =
    JSON.parse(
      localStorage.getItem("retiros")
    ) || [];


  let totalRetiros = 0;

  let pendientes = 0;


  retiros.forEach(function (retiro) {

    totalRetiros +=
      parseFloat(retiro.monto) || 0;


    if (
      !retiro.estado ||
      retiro.estado === "Pendiente"
    ) {

      pendientes++;

    }

  });


  document.getElementById(
    "retiros"
  ).textContent =
    "$" + totalRetiros.toFixed(2);


  document.getElementById(
    "pendientes"
  ).textContent =
    pendientes;


  mostrarRetiros(retiros);

}


/* MOSTRAR RETIROS */

function mostrarRetiros(retiros) {

  const lista =
    document.getElementById(
      "listaRetiros"
    );


  if (retiros.length === 0) {

    lista.innerHTML =
      '<p class="vacio">' +
      'No hay solicitudes registradas.' +
      '</p>';

    return;
  }


  lista.innerHTML = "";


  retiros.slice().reverse().forEach(
    function (retiro, indice) {

      const posicion =
        retiros.length - 1 - indice;


      const estado =
        retiro.estado ||
        "Pendiente";


      const fila =
        document.createElement("div");


      fila.className = "fila";


      let botones = "";


      if (estado === "Pendiente") {

        botones =

          '<div class="botones">' +

          '<button class="aprobar" ' +

          'onclick="aprobarRetiro(' +
          posicion +
          ')">' +

          '✅ Aprobar' +

          '</button>' +


          '<button class="rechazar" ' +

          'onclick="rechazarRetiro(' +
          posicion +
          ')">' +

          '❌ Rechazar' +

          '</button>' +

          '</div>';

      }


      let claseEstado = "";


      if (estado === "Aprobado") {

        claseEstado = "aprobado";

      }


      if (estado === "Rechazado") {

        claseEstado = "rechazado";

      }


      fila.innerHTML =

        '<div class="informacion">' +

        '<strong>📤 Retiro de $' +

        (parseFloat(retiro.monto) || 0)
        .toFixed(2) +

        '</strong><br>' +

        '<small>' +

        'Método: ' +
        (retiro.metodo ||
        "Sin método") +

        '<br>' +

        'Fecha: ' +
        (retiro.fecha || "") +

        '</small>' +

        '</div>' +


        '<span class="estado ' +
        claseEstado +
        '">' +

        estado +

        '</span>' +


        botones;


      lista.appendChild(fila);

    }
  );

}


/* APROBAR RETIRO */

function aprobarRetiro(indice) {

  const retiros =
    JSON.parse(
      localStorage.getItem("retiros")
    ) || [];


  if (!retiros[indice]) {
    return;
  }


  retiros[indice].estado =
    "Aprobado";


  localStorage.setItem(
    "retiros",
    JSON.stringify(retiros)
  );


  alert(
    "✅ Retiro aprobado correctamente."
  );


  cargarDatos();

}


/* RECHAZAR RETIRO */

function rechazarRetiro(indice) {

  const retiros =
    JSON.parse(
      localStorage.getItem("retiros")
    ) || [];


  if (!retiros[indice]) {
    return;
  }


  retiros[indice].estado =
    "Rechazado";


  localStorage.setItem(
    "retiros",
    JSON.stringify(retiros)
  );


  alert(
    "❌ Retiro rechazado."
  );


  cargarDatos();

}

</script>

</body>
</html>
