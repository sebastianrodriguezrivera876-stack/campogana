<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retirar dinero - CampoGana</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111827;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
    }

    header h2 {
      color: #22c55e;
    }

    .volver {
      color: white;
      text-decoration: none;
    }

    .contenedor {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    .caja {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 10px;
    }

    .saldo {
      background: #0f172a;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      text-align: center;
    }

    .saldo span {
      display: block;
      font-size: 32px;
      color: #22c55e;
      margin-top: 8px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      margin-bottom: 18px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #16a34a;
    }

    #mensaje {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h2>CampoGana</h2>
  <a href="panel.html" class="volver">← Volver</a>
</header>

<div class="contenedor">

  <div class="caja">

    <h1>📤 Retirar dinero</h1>

    <p>Solicita el retiro de tu saldo disponible.</p>
    
    <div style="text-align: center; margin: 20px 0;">
  <a href="cuenta-retiro.html"
     style="
       color: #22c55e;
       text-decoration: none;
       font-weight: bold;
     ">
    💳 Configurar cuenta de retiro
  </a>
</div>

    <div class="saldo">
      Saldo disponible
      <span id="saldo">$0.00</span>
    </div>
    
<div id="datosCuenta"
     style="
       background: #0f172a;
       padding: 15px;
       border-radius: 10px;
       margin-bottom: 20px;
     ">
</div>
    
    <label for="monto">Monto a retirar</label>

    <input
  type="number"
  id="monto"
  placeholder="Ej. 100"
  min="1"
  oninput="calcularComision()"
>

    <label for="metodo">Método de retiro</label>
<div id="resumenRetiro"
     style="
       background:#0f172a;
       padding:15px;
       border-radius:10px;
       margin:20px 0;
       line-height:1.8;
       display:none;
     ">
</div>
    
    <select id="metodo">
      <option value="Transferencia bancaria">
        Transferencia bancaria
      </option>

      <option value="QR">
        QR
      </option>

      <option value="Billetera digital">
        Billetera digital
      </option>
    </select>

    <button onclick="retirarDinero()">
      Retirar dinero
    </button>

    <div id="mensaje"></div>

  </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

  const usuario = localStorage.getItem("usuario");

  if (!usuario) {
    window.location.href = "index.html";
    return;
  }

  actualizarSaldo();
  
function mostrarCuenta() {

function calcularComision() {

  const monto =
    parseFloat(
      document.getElementById("monto").value
    ) || 0;

  const resumen =
    document.getElementById("resumenRetiro");

  if (monto <= 0) {

    resumen.style.display = "none";

    return;
  }

  const comision =
    monto * 0.10;

  const usuarioRecibe =
    monto - comision;

  resumen.style.display = "block";

  resumen.innerHTML =

    "<strong>Resumen del retiro</strong><br><br>" +

    "💵 Monto solicitado: <strong>" +
    monto.toFixed(2) +
    " Bs</strong><br>" +

    "📉 Comisión CampoGana (10%): <strong>" +
    comision.toFixed(2) +
    " Bs</strong><br>" +

    "✅ Usuario recibe: <strong>" +
    usuarioRecibe.toFixed(2) +
    " Bs</strong>";
}

function retirarDinero() {

  const monto =
    parseFloat(document.getElementById("monto").value);

  const metodo =
    document.getElementById("metodo").value;

  const mensaje =
    document.getElementById("mensaje");

  const saldo =
    parseFloat(localStorage.getItem("saldo")) || 0;


  if (!monto || monto <= 0) {

    mensaje.textContent =
      "❌ Ingresa un monto válido.";

    mensaje.style.color = "red";

    return;
  }


  if (monto > saldo) {

    mensaje.textContent =
      "❌ No tienes suficiente saldo.";

    mensaje.style.color = "red";

    return;
  }


  const nuevoSaldo =
    saldo - monto;


  localStorage.setItem(
    "saldo",
    nuevoSaldo.toFixed(2)
  );


  let retiros =
    JSON.parse(localStorage.getItem("retiros")) || [];


  const retiro = {

    monto: monto.toFixed(2),

    metodo: metodo,

    fecha: new Date().toLocaleString(),

    saldoDespues: nuevoSaldo.toFixed(2)

  };


  retiros.push(retiro);


  localStorage.setItem(
    "retiros",
    JSON.stringify(retiros)
  );


  mensaje.textContent =
    "✅ Retiro registrado correctamente.";

  mensaje.style.color = "#22c55e";


  actualizarSaldo();


  document.getElementById("monto").value = "";

}

</script>

</body>
</html>
