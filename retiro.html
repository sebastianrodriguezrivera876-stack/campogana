<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Retirar dinero - CampoGana</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111827;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
    }

    header h2 {
      color: #22c55e;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .contenedor {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    .tarjeta {
      background: #1e293b;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .descripcion {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    .saldo {
      background: #14532d;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .saldo small {
      color: #bbf7d0;
    }

    .saldo h2 {
      margin-top: 8px;
      color: #4ade80;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .cuenta {
      background: #0f172a;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      line-height: 1.7;
    }

    .resumen {
      background: #0f172a;
      padding: 18px;
      border-radius: 10px;
      margin-top: 20px;
      line-height: 1.9;
      display: none;
    }

    .comision {
      color: #fbbf24;
    }

    .recibe {
      color: #4ade80;
      font-size: 18px;
    }

    .enlace {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #4ade80;
      text-decoration: none;
    }

  </style>

</head>

<body>

<header>

  <h2>CampoGana</h2>

  <a href="dashboard.html">
    ← Volver
  </a>

</header>


<div class="contenedor">

  <div class="tarjeta">

    <h1>📤 Retirar dinero</h1>

    <p class="descripcion">
      Solicita tu retiro en bolivianos.
    </p>


    <div class="saldo">

      <small>Saldo disponible</small>

      <h2 id="saldo">
        100.00 Bs
      </h2>

    </div>


    <div class="cuenta">

      <strong>🏦 Cuenta de retiro</strong>

      <div id="datosCuenta">
        No tienes una cuenta de retiro registrada.
      </div>

    </div>


    <a
      href="cuenta-retiro.html"
      class="enlace"
    >
      ⚙️ Configurar cuenta de retiro
    </a>


    <label for="monto">
      💵 Monto a retirar
    </label>

    <input
      type="number"
      id="monto"
      placeholder="Ej. 100 Bs"
      min="1"
      step="0.01"
      oninput="calcularComision()"
    >


    <label for="metodo">
      💳 Método de retiro
    </label>

    <select id="metodo">

      <option value="Transferencia bancaria">
        Transferencia bancaria
      </option>

      <option value="QR">
        QR
      </option>

      <option value="Billetera digital">
        Billetera digital
      </option>

    </select>


    <div
      class="resumen"
      id="resumenRetiro"
    >
    </div>


    <button onclick="registrarRetiro()">

      📤 Registrar solicitud de retiro

    </button>

  </div>

</div>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    const usuario =
      localStorage.getItem("usuario");

    if (!usuario) {

      window.location.href =
        "index.html";

      return;

    }

    mostrarSaldo();

    mostrarCuenta();

  }
);


function mostrarSaldo() {

  const saldo =
    parseFloat(
      localStorage.getItem("saldo")
    ) || 100;

  document.getElementById(
    "saldo"
  ).textContent =
    saldo.toFixed(2) + " Bs";

}


function mostrarCuenta() {

  const cuenta =
    JSON.parse(
      localStorage.getItem(
        "cuentaRetiro"
      )
    );

  const datos =
    document.getElementById(
      "datosCuenta"
    );

  if (!cuenta) {

    datos.innerHTML =
      "No tienes una cuenta de retiro registrada.";

    return;

  }

  datos.innerHTML =

    "<strong>" +
    cuenta.nombre +
    "</strong><br>" +

    "📱 " +
    cuenta.telefono +
    "<br>" +

    "💳 " +
    cuenta.metodo +
    "<br>" +

    "🔢 " +
    cuenta.cuenta;

}


function calcularComision() {

  const monto =
    parseFloat(
      document.getElementById(
        "monto"
      ).value
    ) || 0;

  const resumen =
    document.getElementById(
      "resumenRetiro"
    );

  if (monto <= 0) {

    resumen.style.display =
      "none";

    return;

  }

  const comision =
    monto * 0.10;

  const recibe =
    monto - comision;

  resumen.style.display =
    "block";

  resumen.innerHTML =

    "<strong>📋 Resumen del retiro</strong><br><br>" +

    "💵 Monto solicitado: <strong>" +
    monto.toFixed(2) +
    " Bs</strong><br>" +

    "<span class='comision'>" +

    "📉 Comisión CampoGana (10%): <strong>" +
    comision.toFixed(2) +
    " Bs</strong>" +

    "</span><br>" +

    "<span class='recibe'>" +

    "✅ Usuario recibe: <strong>" +
    recibe.toFixed(2) +
    " Bs</strong>" +

    "</span>";

}


function registrarRetiro() {

  const monto =
    parseFloat(
      document.getElementById(
        "monto"
      ).value
    );

  const metodo =
    document.getElementById(
      "metodo"
    ).value;

  const saldo =
    parseFloat(
      localStorage.getItem("saldo")
    ) || 100;


  if (!monto || monto <= 0) {

    alert(
      "❌ Ingresa un monto válido en Bs."
    );

    return;

  }


  if (monto > saldo) {

    alert(
      "❌ No tienes suficiente saldo."
    );

    return;

  }


  const comision =
    monto * 0.10;

  const recibe =
    monto - comision;


  const confirmar =
    confirm(

      "¿Confirmar retiro?\n\n" +

      "Monto: " +
      monto.toFixed(2) +
      " Bs\n" +

      "Comisión CampoGana (10%): " +
      comision.toFixed(2) +
      " Bs\n" +

      "Usuario recibe: " +
      recibe.toFixed(2) +
      " Bs"

    );


  if (!confirmar) {

    return;

  }


  const retiros =
    JSON.parse(
      localStorage.getItem(
        "retiros"
      )
    ) || [];


  retiros.push({

    monto:
      monto.toFixed(2),

    comision:
      comision.toFixed(2),

    montoRecibido:
      recibe.toFixed(2),

    metodo:
      metodo,

    estado:
      "Pendiente",

    fecha:
      new Date().toLocaleString()

  });


  localStorage.setItem(

    "retiros",

    JSON.stringify(retiros)

  );


  const nuevoSaldo =
    saldo - monto;


  localStorage.setItem(

    "saldo",

    nuevoSaldo.toFixed(2)

  );


  alert(

    "✅ Solicitud registrada.\n\n" +

    "Monto: " +
    monto.toFixed(2) +
    " Bs\n" +

    "Comisión: " +
    comision.toFixed(2) +
    " Bs\n" +

    "Usuario recibe: " +
    recibe.toFixed(2) +
    " Bs\n\n" +

    "Estado: Pendiente"

  );


  window.location.reload();

}

</script>

</body>

</html>
