<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cuenta de retiro - CampoGana</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111827;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
    }

    header h2 {
      color: #22c55e;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    .contenedor {
      max-width: 550px;
      margin: 40px auto;
      padding: 20px;
    }

    .caja {
      background: #1e293b;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .descripcion {
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 8px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    #mensaje {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h2>CampoGana</h2>
  <a href="panel.html">← Volver</a>
</header>

<div class="contenedor">

  <div class="caja">

    <h1>💳 Mi cuenta de retiro</h1>

    <p class="descripcion">
      Guarda tus datos para utilizarse en futuras solicitudes de retiro.
    </p>

    <label for="nombre">
      Nombre completo
    </label>

    <input
      type="text"
      id="nombre"
      placeholder="Escribe tu nombre completo"
    >

    <label for="telefono">
      Número de teléfono
    </label>

    <input
      type="tel"
      id="telefono"
      placeholder="Ej. 70000000"
    >

    <label for="metodo">
      Método de retiro
    </label>

    <select id="metodo">

      <option value="Transferencia bancaria">
        Transferencia bancaria
      </option>

      <option value="QR">
        QR
      </option>

      <option value="Billetera digital">
        Billetera digital
      </option>

    </select>

    <label for="cuenta">
      Número de cuenta o dato de pago
    </label>

    <input
      type="text"
      id="cuenta"
      placeholder="Ingresa el dato correspondiente"
    >

    <button onclick="guardarCuenta()">
      💾 Guardar datos
    </button>

    <div id="mensaje"></div>

  </div>

</div>

<script>

document.addEventListener("DOMContentLoaded", function () {

  const usuario =
    localStorage.getItem("usuario");

  if (!usuario) {
    window.location.href = "index.html";
    return;
  }


  const datos =
    JSON.parse(
      localStorage.getItem("cuentaRetiro")
    );


  if (datos) {

    document.getElementById("nombre").value =
      datos.nombre || "";

    document.getElementById("telefono").value =
      datos.telefono || "";

    document.getElementById("metodo").value =
      datos.metodo || "Transferencia bancaria";

    document.getElementById("cuenta").value =
      datos.cuenta || "";

  }

});


function guardarCuenta() {

  const nombre =
    document.getElementById("nombre").value.trim();

  const telefono =
    document.getElementById("telefono").value.trim();

  const metodo =
    document.getElementById("metodo").value;

  const cuenta =
    document.getElementById("cuenta").value.trim();

  const mensaje =
    document.getElementById("mensaje");


  if (!nombre || !telefono || !cuenta) {

    mensaje.textContent =
      "❌ Completa todos los campos.";

    mensaje.style.color = "red";

    return;
  }


  const datos = {

    nombre: nombre,

    telefono: telefono,

    metodo: metodo,

    cuenta: cuenta

  };


  localStorage.setItem(
    "cuentaRetiro",
    JSON.stringify(datos)
  );


  mensaje.textContent =
    "✅ Datos guardados correctamente.";

  mensaje.style.color =
    "#22c55e";

}

</script>

</body>
</html>
