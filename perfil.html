<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil - CampoGana</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #07111f;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 7%;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
    }

    .volver {
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border: 1px solid #334155;
      border-radius: 8px;
    }

    main {
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
    }

    .perfil {
      background: #0f1b2d;
      border: 1px solid #1e293b;
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #22c55e;
      color: #04110a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitulo {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .dato {
      background: #07111f;
      border: 1px solid #1e293b;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .dato strong {
      display: block;
      color: #22c55e;
      margin-bottom: 6px;
    }

    .dato span {
      color: #e2e8f0;
      word-break: break-word;
    }

    .cerrar {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ef4444;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .cerrar:hover {
      background: #dc2626;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px;
      }

      main {
        margin: 25px auto;
        padding: 15px;
      }

      .perfil {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">CampoGana</div>

    <a href="dashboard.html" class="volver">
      ← Volver
    </a>
  </header>

  <main>

    <section class="perfil">

      <div class="avatar" id="avatar">
        👤
      </div>

      <h1 id="nombre">Usuario</h1>

      <p class="subtitulo">
        Información de tu cuenta
      </p>

      <div class="dato">
        <strong>👤 Nombre completo</strong>
        <span id="nombreCompleto">Cargando...</span>
      </div>

      <div class="dato">
        <strong>📧 Correo electrónico</strong>
        <span id="correo">Cargando...</span>
      </div>

      <button class="cerrar" onclick="cerrarSesion()">
        Cerrar sesión
      </button>

    </section>

  </main>

  <script>

    const usuarioGuardado = localStorage.getItem("usuario");

    if (!usuarioGuardado) {

      window.location.href = "login.html";

    } else {

      const usuario = JSON.parse(usuarioGuardado);

      document.getElementById("nombre").textContent =
        usuario.nombre;

      document.getElementById("nombreCompleto").textContent =
        usuario.nombre;

      document.getElementById("correo").textContent =
        usuario.correo;

      if (usuario.nombre) {
        document.getElementById("avatar").textContent =
          usuario.nombre.charAt(0).toUpperCase();
      }

    }

    function cerrarSesion() {

      localStorage.removeItem("usuario");

      window.location.href = "index.html";

    }

  </script>

</body>
</html>
